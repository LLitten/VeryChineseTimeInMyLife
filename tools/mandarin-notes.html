<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Mandarin notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #edf1f5;
  --surface: #ffffff;
  --ink: #16222e;
  --muted: #5a6978;
  --line: #cbd5df;
  --accent: #1d6f8a;
  --accent-soft: #dcecf2;
  --accent-ink: #ffffff;
  --flag: #9a5b00;
  --flag-bg: #fbeed3;
  --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --serif-tc: "Noto Serif TC", "Songti TC", "PMingLiU", "Noto Serif SC", serif;
  --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1820;
    --surface: #17232e;
    --ink: #e6edf3;
    --muted: #94a3b2;
    --line: #2b3b49;
    --accent: #5bb3d0;
    --accent-soft: #1b3644;
    --accent-ink: #0b1620;
    --flag: #f0b45a;
    --flag-bg: #3a2c12;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1820;
  --surface: #17232e;
  --ink: #e6edf3;
  --muted: #94a3b2;
  --line: #2b3b49;
  --accent: #5bb3d0;
  --accent-soft: #1b3644;
  --accent-ink: #0b1620;
  --flag: #f0b45a;
  --flag-bg: #3a2c12;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.4;
  -webkit-text-size-adjust: 100%;
}
main { max-width: 640px; margin: 0 auto; padding: 10px 12px calc(84px + env(safe-area-inset-bottom, 0px)); }
.home { display: inline-block; margin: calc(6px + env(safe-area-inset-top, 0px)) 4px 0; font-size: 14px; color: var(--muted); text-decoration: none; }
h1 { font-size: 22px; line-height: 1.2; margin: 6px 4px 4px; }
.sub { margin: 0 4px 12px; color: var(--muted); font-size: 14px; }
.search, .sel {
  display: block;
  width: 100%;
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 12px;
}
.search { min-height: 48px; padding: 10px 14px; font-size: 17px; }
.sel { min-height: 44px; padding: 8px 10px; font-size: 15px; }
.search:focus, .sel:focus { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.lab { display: block; margin: 12px 4px 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -12px; padding: 2px 12px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; }
/* With a mouse there's no swipe, so wrap the chips onto several lines instead. */
@media (hover: hover) and (pointer: fine) {
  .chips { flex-wrap: wrap; overflow-x: visible; margin: 0; padding: 2px 0; }
  .subchips { padding: 8px; border-radius: 14px; }
}
.chip {
  appearance: none;
  min-height: 36px;
  padding: 5px 12px;
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 18px;
  cursor: pointer;
}
.chip small { color: var(--muted); font-size: 12px; margin-left: 3px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip[aria-pressed="true"] small { color: inherit; opacity: 0.85; }
.subchips { margin-top: 8px; padding-top: 8px; padding-bottom: 8px; background: var(--accent-soft); }
.subchips:empty { display: none; }
.subchips .chip { min-height: 32px; font-size: 13px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.two label { min-width: 0; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.tg {
  appearance: none;
  min-height: 36px;
  padding: 5px 12px;
  font: inherit;
  font-size: 14px;
  color: var(--muted);
  background: none;
  border: 1.5px dashed var(--line);
  border-radius: 18px;
  cursor: pointer;
}
.tg[aria-pressed="true"] { color: var(--ink); background: var(--surface); border-style: solid; border-color: var(--accent); }
.tg.plain { border-style: solid; color: var(--ink); background: var(--surface); }
.chip:focus-visible, .tg:focus-visible, .main:focus-visible, .hd button:focus-visible, .btn:focus-visible, .lnk:focus-visible, .home:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.count { margin: 12px 4px 6px; color: var(--muted); font-size: 14px; }

/* Word rows: simplified + pinyin | TW + zhuyin | meaning */
.hd, .main.word {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.15fr);
  gap: 10px;
}
.no-tw .hd, .no-tw .main.word { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); }
.no-tw .c-tw { display: none; }
.hd { padding: 0 10px; margin-top: 2px; }
.hd button, .hd span {
  appearance: none;
  background: none;
  border: 0;
  padding: 6px 0;
  font: inherit;
  font-size: 12px;
  font-weight: 700;
  text-align: left;
  color: var(--muted);
}
.hd button { cursor: pointer; }
.rows { display: grid; gap: 6px; }
.row { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
.main {
  appearance: none;
  width: 100%;
  padding: 10px;
  text-align: left;
  font: inherit;
  color: var(--ink);
  background: none;
  border: 0;
  cursor: pointer;
}
.main.word { align-items: center; }
.zh { display: block; font-family: var(--serif); font-weight: 700; font-size: 26px; line-height: 1.15; overflow-wrap: anywhere; }
.c-tw .zh { font-family: var(--serif-tc); }
.zh.same { color: var(--muted); font-weight: 500; }
.zh.m { font-size: 21px; }
.zh.l { font-size: 18px; }
.py, .zy { display: block; margin-top: 3px; font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
.zy { font-family: var(--serif-tc); font-size: 15px; }
.mean { font-size: 15px; }
.fl { color: var(--flag); font-size: 14px; margin-left: 4px; font-family: var(--sans); font-weight: 400; }
.hide-p .row:not(.open) .py,
.hide-z .row:not(.open) .zy,
.hide-m .row:not(.open) .mean,
.hide-m .row:not(.open) .ex { filter: blur(7px); }

/* Grammar and sentence rows */
.main.wide { display: block; }
.main.wide .zh { font-size: 20px; }
.gtag { display: block; margin-top: 4px; font-size: 13px; color: var(--muted); }
.main.wide .py { margin-top: 4px; }
.main.wide .mean { display: block; margin-top: 4px; }
.ex { display: block; margin-top: 6px; font-family: var(--serif); font-size: 17px; }

.det { padding: 2px 12px 12px; border-top: 1px dashed var(--line); font-size: 15px; }
.det p { margin: 8px 0 0; }
.det ul { margin: 6px 0 0; padding-left: 18px; }
.det li { margin-top: 4px; }
.det .chk { margin-top: 8px; padding: 8px 10px; color: var(--flag); background: var(--flag-bg); border-radius: 8px; font-size: 14px; }
.det .src { font-size: 13px; color: var(--muted); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag {
  appearance: none;
  padding: 3px 10px;
  font: inherit;
  font-size: 12px;
  color: var(--muted);
  background: none;
  border: 1px solid var(--line);
  border-radius: 10px;
  cursor: pointer;
}
.tag.use { color: var(--accent); border-color: var(--accent); }
.tag:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.links { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.links small { color: var(--muted); font-size: 12px; margin-right: 2px; }
.lnk {
  display: inline-block;
  min-width: 38px;
  padding: 5px 9px;
  text-align: center;
  font-family: var(--serif);
  font-size: 17px;
  color: var(--accent);
  text-decoration: none;
  border: 1.5px solid var(--line);
  border-radius: 8px;
}
.empty { margin: 24px 4px; color: var(--muted); }
.foot { margin: 22px 4px 0; color: var(--muted); font-size: 13px; }
.btn {
  appearance: none;
  width: 100%;
  min-height: 48px;
  margin-top: 16px;
  font: inherit;
  font-weight: 600;
  color: var(--accent-ink);
  background: var(--accent);
  border: 0;
  border-radius: 12px;
  cursor: pointer;
}
.status { margin: 8px 4px 0; color: var(--muted); font-size: 14px; min-height: 20px; }
.fab {
  position: fixed;
  right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 6px;
  max-width: calc(100% - 24px);
  min-height: 46px;
  padding: 8px 16px;
  font: inherit;
  font-size: 15px;
  font-weight: 600;
  color: var(--accent-ink);
  background: var(--accent);
  border: 0;
  border-radius: 23px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
  cursor: pointer;
  opacity: 0;
  transform: translateY(12px);
  pointer-events: none;
  transition: opacity 0.15s, transform 0.15s;
}
.fab.show { opacity: 1; transform: none; pointer-events: auto; }
.fab .what { font-weight: 400; opacity: 0.9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fab:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .fab { transition: none; } }
</style>
</head>
<body>
<main>
<a class="home" href="../index.html">← All tools</a>
<h1>My Mandarin notes</h1>
<p class="sub">Every word and phrase. Pick a situation, or narrow by notebook topic or word type. Tap a row for details. For grammar and lessons, see <a href="../topics/index.html">Lessons</a>.</p>
<input id="q" class="search" type="search" placeholder="Search characters, pinyin or English" aria-label="Search notes" autocomplete="off" autocapitalize="off" spellcheck="false">

<span class="lab" id="sit-lab">Situation</span>
<div class="chips" id="groups" role="group" aria-labelledby="sit-lab"></div>
<div class="chips subchips" id="subs" role="group" aria-label="Narrower situation"></div>

<div class="two">
  <label><span class="lab">Notebook topic</span><select id="f-topic" class="sel"></select></label>
  <label><span class="lab">Word type</span><select id="f-type" class="sel"></select></label>
</div>

<div class="toggles" id="toggles"></div>
<div class="count" id="count" aria-live="polite"></div>
<div class="hd" id="hd"></div>
<div class="rows" id="rows"></div>
<div id="foot"></div>
</main>
<button type="button" class="fab" id="fab" aria-label="Back to filters"><span aria-hidden="true">↑</span><span>Filters</span><span class="what" id="fab-what"></span></button>

  elGroups.appendChild(chip("All", null, app.group === "All", function () { setSituation("All", "All"); }));
  GROUPS.forEach(function (g) {
    var n = ENTRIES.filter(function (e) { return inGroup(e, g.name); }).length;
    elGroups.appendChild(chip(g.name, n, app.group === g.name, function () {
      setSituation(app.group === g.name ? "All" : g.name, "All");
    }));
  });
  elSubs.innerHTML = "";
  var g = GROUPS.filter(function (x) { return x.name === app.group; })[0];
  if (!g) return;
  elSubs.appendChild(chip("All " + g.name.toLowerCase(), null, app.use === "All", function () { setSituation(g.name, "All"); }));
  g.uses.forEach(function (u) {
    var n = ENTRIES.filter(function (e) { return e.uses.indexOf(u) !== -1; }).length;
    elSubs.appendChild(chip(u, n, app.use === u, function () { setSituation(g.name, app.use === u ? "All" : u); }));
  });
}
function setSituation(group, use) {
  app.group = group; app.use = use; app.shuffled = null;
  save(); buildSituations(); render();
}

function fillSelect(key, values, allLabel) {
  var s = sel[key];
  var counts = {};
  ENTRIES.forEach(function (e) { counts[e[key]] = (counts[e[key]] || 0) + 1; });
  s.innerHTML = "";
  var a = el("option", "", allLabel);
  a.value = "All";
  s.appendChild(a);
  var group = null;
  values.forEach(function (v) {
    var target = s;
    if (key === "topic" && v.indexOf("Grammar: ") === 0) {
      if (!group) { group = el("optgroup"); group.label = "Grammar"; s.appendChild(group); }
      target = group;
    }
    var o = el("option", "", (key === "topic" ? v.replace("Grammar: ", "") : v) + " (" + (counts[v] || 0) + ")");
    o.value = v;
    target.appendChild(o);
  });
  if (values.indexOf(app[key]) === -1) app[key] = "All";
  s.value = app[key];
  s.addEventListener("change", function () { app[key] = s.value; app.shuffled = null; save(); render(); });
}

/* ---------- display toggles ---------- */
var TOGGLES = [["showP", "Pinyin"], ["showZ", "Zhuyin"], ["showM", "Meaning"], ["showTW", "TW column"]];
function applyView() {
  elRows.classList.toggle("hide-p", !app.showP);
  elRows.classList.toggle("hide-z", !app.showZ);
  elRows.classList.toggle("hide-m", !app.showM);
  document.querySelector("main").classList.toggle("no-tw", !app.showTW);
}
function buildToggles() {
  var box = document.getElementById("toggles");
  TOGGLES.forEach(function (t) {
    var b = el("button", "tg", t[1]);
    b.type = "button";
    b.setAttribute("aria-pressed", String(app[t[0]]));
    b.addEventListener("click", function () {
      app[t[0]] = !app[t[0]];
      b.setAttribute("aria-pressed", String(app[t[0]]));
      save(); applyView();
    });
    box.appendChild(b);
  });
  var anyFlag = ENTRIES.some(function (e) { return e.flag; });
  if (!anyFlag) app.onlyFlag = false;
  var fl = el("button", "tg", "Only ⚑ to check");
  if (!anyFlag) fl.hidden = true;
  fl.type = "button";
  fl.setAttribute("aria-pressed", String(app.onlyFlag));
  fl.addEventListener("click", function () {
    app.onlyFlag = !app.onlyFlag;
    fl.setAttribute("aria-pressed", String(app.onlyFlag));
    save(); render();
  });
  box.appendChild(fl);
  var sh = el("button", "tg plain", "Shuffle");
  sh.type = "button";
  sh.addEventListener("click", function () {
    var idx = ENTRIES.map(function (e) { return e.i; });
    for (var i = idx.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = idx[i]; idx[i] = idx[j]; idx[j] = t;
    }
    app.shuffled = idx; app.sortKey = null; render();
  });
  box.appendChild(sh);
  var rs = el("button", "tg plain", "Clear filters");
  rs.type = "button";
  rs.addEventListener("click", function () {
    app.q = ""; elQ.value = "";
    app.group = app.use = app.topic = app.type = "All";
    app.onlyFlag = false; fl.setAttribute("aria-pressed", "false");
    app.shuffled = null; app.sortKey = null;
    sel.topic.value = "All"; sel.type.value = "All";
    save(); buildSituations(); render();
  });
  box.appendChild(rs);
}

/* ---------- rows ---------- */
function buildHeader() {
  elHd.innerHTML = "";
  function sortBtn(key, label) {
    var b = el("button", "", label + (app.sortKey === key ? (app.sortDir > 0 ? " ▲" : " ▼") : ""));
    b.type = "button";
    b.setAttribute("aria-label", "Sort by " + label);
    b.addEventListener("click", function () {
      if (app.sortKey === key) app.sortDir = -app.sortDir; else { app.sortKey = key; app.sortDir = 1; }
      app.shuffled = null; render();
    });
    return b;
  }
  elHd.appendChild(sortBtn("p", "Word · pinyin"));
  var tw = el("span", "c-tw", "TW · zhuyin");
  elHd.appendChild(tw);
  elHd.appendChild(sortBtn("m", "Meaning"));
}

function sizeClass(s) {
  var n = (s.match(/[㄀-ㄯ一-鿿]/g) || []).length;
  return n >= 5 ? " l" : n >= 4 ? " m" : "";
}
function strokeChars(e) {
  var seen = {}, chars = [];
  (e.s + (e.t || "")).split("").forEach(function (ch) {
    if (/[一-鿿]/.test(ch) && !seen[ch]) { seen[ch] = 1; chars.push(ch); }
  });
  return chars.slice(0, 8);
}
function setFilter(key, value) {
  if (key === "use") { app.group = GROUP_OF[value] || "All"; app.use = value; buildSituations(); }
  else { app[key] = value; sel[key].value = value; }
  app.shuffled = null; save(); render();
  window.scrollTo(0, 0);
}
var SOURCE = {
  "hsk-list": "A common beginner word (HSK 1 list) that isn’t in your notes yet.",
  "added": "Added by Claude, not from your notes. Check it with friends."
};

function wordMain(e) {
  var btn = el("button", "main word");
  var a = el("span", "c-s");
  var zs = el("span", "zh" + sizeClass(e.s), e.s);
  if (e.flag) zs.appendChild(el("span", "fl", "⚑"));
  a.appendChild(zs);
  if (e.p) a.appendChild(el("span", "py", e.p));
  var b = el("span", "c-tw");
  if (e.type !== "sound") {
    b.appendChild(el("span", "zh" + sizeClass(e.t || e.s) + (e.t ? "" : " same"), e.t || e.s));
    if (e.z) b.appendChild(el("span", "zy", e.z));
  }
  btn.appendChild(a);
  btn.appendChild(b);
  btn.appendChild(el("span", "mean", e.m));
  return btn;
}
function wideMain(e) {
  var btn = el("button", "main wide");
  var zs = el("span", "zh", e.s);
  if (e.flag) zs.appendChild(el("span", "fl", "⚑"));
  btn.appendChild(zs);
  if (e.status) btn.appendChild(el("span", "gtag", e.status));
  if (e.p) btn.appendChild(el("span", "py", e.p));
  btn.appendChild(el("span", "mean", e.m));
  if (e.kind === "grammar" && e.n) btn.appendChild(el("span", "ex", e.n));
  return btn;
}

function rowEl(e) {
  var row = el("div", "row");
  var btn = e.kind === "word" ? wordMain(e) : wideMain(e);
  btn.type = "button";
  btn.setAttribute("aria-expanded", "false");
  row.appendChild(btn);

  var det = el("div", "det");
  det.hidden = true;
  if (e.t) det.appendChild(el("p", "", "Taiwan form: " + e.t + (e.z ? "  ·  " + e.z : "")));
  if (e.b) det.appendChild(el("p", "", "Parts: " + e.b));
  if (e.kind !== "grammar" && e.n) det.appendChild(el("p", "", e.n));
  if (e.extra && e.extra.length) {
    var ul = el("ul");
    e.extra.forEach(function (x) { ul.appendChild(el("li", "", x)); });
    det.appendChild(ul);
  }
  if (e.flag) det.appendChild(el("div", "chk", e.kind === "grammar"
    ? "⚑ Your handwritten note on this needed a correction. It's stated above."
    : "⚑ Worth double-checking: a reading was unclear or the note may need a correction."));
  if (SOURCE[e.src]) det.appendChild(el("p", "src", SOURCE[e.src]));
  if (e.by) det.appendChild(el("p", "src", "Taught by " + e.by + "."));

  var tags = el("div", "tags");
  function tag(label, key, value, cls) {
    var c = el("button", "tag" + (cls ? " " + cls : ""), label);
    c.type = "button";
    c.setAttribute("aria-label", "Show all: " + label);
    c.addEventListener("click", function (ev) { ev.stopPropagation(); setFilter(key, value); });
    tags.appendChild(c);
  }
  e.uses.forEach(function (u) { tag(u, "use", u, "use"); });
  tag(e.topic.replace("Grammar: ", "Grammar · "), "topic", e.topic);
  tag(e.type, "type", e.type);
  det.appendChild(tags);

  if (e.kind === "word" && e.type !== "sound") {
    var chars = strokeChars(e);
    if (chars.length) {
      var box = el("div", "links");
      box.appendChild(el("small", "", "Stroke order:"));
      chars.forEach(function (ch) {
        var a = el("a", "lnk", ch);
        a.href = "https://www.strokeorder.com/chinese/" + encodeURIComponent(ch);
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.setAttribute("aria-label", "Stroke order for " + ch);
        box.appendChild(a);
      });
      det.appendChild(box);
    }
  }
  row.appendChild(det);

  btn.addEventListener("click", function () {
    var open = det.hidden;
    det.hidden = !open;
    row.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", String(open));
  });
  return row;
}

function render() {
  buildHeader();
  var list = ENTRIES.filter(matches);
  if (app.shuffled) {
    var pos = {};
    app.shuffled.forEach(function (id, k) { pos[id] = k; });
    list.sort(function (a, b) { return pos[a.i] - pos[b.i]; });
  } else if (app.sortKey) {
    var k = app.sortKey;
    list.sort(function (a, b) {
      var x = plain(a[k]), y = plain(b[k]);
      return (x < y ? -1 : x > y ? 1 : 0) * app.sortDir;
    });
  }
  elRows.innerHTML = "";
  list.forEach(function (e) { elRows.appendChild(rowEl(e)); });
  if (!list.length) elRows.appendChild(el("p", "empty", "Nothing matches. Try fewer letters, or tap Clear filters."));
  elCount.textContent = "Showing " + list.length + " of " + ENTRIES.length;
  applyView();
  updateFab();
}

function csvText() {
  function q(s) { return '"' + String(s || "").replace(/"/g, '""') + '"'; }
  var rows = [["Simplified", "Traditional (TW)", "Pinyin", "Zhuyin", "Meaning", "Topic", "Type", "Situations", "Parts", "Note", "Check"]];
  ENTRIES.forEach(function (e) {
    rows.push([e.s, e.t, e.p, e.z, e.m, e.topic, e.type, e.uses.join("; "), e.b, e.n, e.flag ? "check" : ""]);
  });
  return "﻿" + rows.map(function (r) { return r.map(q).join(","); }).join("\n");
}
function buildFoot() {
  var foot = document.getElementById("foot");
  var note = el("p", "foot", "Built from handwritten notes. When a word is the same in Taiwan, the TW column repeats it in grey. Zhuyin follows the pinyin; for 星期 it shows Taiwan's xīngqí. The zhuyin chart is in the Pronunciation lesson. Stroke-order links go to strokeorder.com.");
  foot.appendChild(note);
  var status = el("p", "status");
  status.setAttribute("role", "status");
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then(function (dl) {
      if (!dl) return;
      var b = el("button", "btn", "Save everything as a spreadsheet file (CSV)");
      b.type = "button";
      b.addEventListener("click", function () {
        dl.save({ filename: "mandarin-notes.csv", data: csvText() }).then(function () {
          status.textContent = "Saved. Open it in Sheets or Excel.";
        }, function (err) {
          status.textContent = err && err.code === "declined" ? "Not saved." : "Saving isn’t available here.";
        });
      });
      foot.insertBefore(b, note);
    }, function () {});
  }
  foot.appendChild(status);
}

elQ.addEventListener("input", function () { app.q = elQ.value; app.shuffled = null; render(); });
/* ---------- floating "back to filters" button ---------- */
var fab = document.getElementById("fab");
var fabWhat = document.getElementById("fab-what");
function filterSummary() {
  var bits = [];
  if (app.use !== "All") bits.push(app.use); else if (app.group !== "All") bits.push(app.group);
  if (app.topic !== "All") bits.push(app.topic.replace("Grammar: ", ""));
  if (app.type !== "All") bits.push(app.type);
  if (app.q.trim()) bits.push("“" + app.q.trim() + "”");
  return bits.join(" · ");
}
function updateFab() {
  var t = filterSummary();
  fabWhat.textContent = t ? "· " + t : "";
  fab.setAttribute("aria-label", "Back to filters" + (t ? ", showing " + t : ""));
}
fab.addEventListener("click", function () {
  var smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({ top: 0, behavior: smooth ? "smooth" : "auto" });
});
if ("IntersectionObserver" in window) {
  new IntersectionObserver(function (es) {
    fab.classList.toggle("show", !es[0].isIntersecting && es[0].boundingClientRect.top < 0);
  }).observe(document.getElementById("toggles"));
} else {
  window.addEventListener("scroll", function () { fab.classList.toggle("show", window.scrollY > 600); }, { passive: true });
}

fillSelect("topic", DATA.topics, "All topics");
fillSelect("type", DATA.types, "All types");
buildSituations();
buildToggles();
buildFoot();
render();
</script>
</body>
</html>
