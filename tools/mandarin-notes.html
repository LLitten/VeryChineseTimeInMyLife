<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Mandarin notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #edf1f5;
  --surface: #ffffff;
  --ink: #16222e;
  --muted: #5a6978;
  --line: #cbd5df;
  --accent: #1d6f8a;
  --accent-ink: #ffffff;
  --flag: #9a5b00;
  --flag-bg: #fbeed3;
  --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1820;
    --surface: #17232e;
    --ink: #e6edf3;
    --muted: #94a3b2;
    --line: #2b3b49;
    --accent: #5bb3d0;
    --accent-ink: #0b1620;
    --flag: #f0b45a;
    --flag-bg: #3a2c12;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1820;
  --surface: #17232e;
  --ink: #e6edf3;
  --muted: #94a3b2;
  --line: #2b3b49;
  --accent: #5bb3d0;
  --accent-ink: #0b1620;
  --flag: #f0b45a;
  --flag-bg: #3a2c12;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.4;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 10;
}
main { max-width: 640px; margin: 0 auto; padding: 14px 12px 32px; }
h1 { font-size: 22px; line-height: 1.2; margin: 4px 4px 4px; }
.sub { margin: 0 4px 12px; color: var(--muted); font-size: 14px; }
.search {
  display: block;
  width: 100%;
  min-height: 48px;
  padding: 10px 14px;
  font: inherit;
  font-size: 17px;
  color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 12px;
}
.search:focus, .sel:focus { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.sel {
  display: block;
  width: 100%;
  min-height: 46px;
  margin-top: 8px;
  padding: 8px 12px;
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 12px;
}
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
.pill {
  appearance: none;
  min-height: 40px;
  padding: 6px 13px;
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 20px;
  cursor: pointer;
}
.pill[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); font-weight: 600; }
.pill:focus-visible, .main:focus-visible, .hd button:focus-visible, .btn:focus-visible, .lnk:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.count { margin: 8px 4px 6px; color: var(--muted); font-size: 14px; }
.hd {
  display: grid;
  grid-template-columns: 1.05fr 0.95fr 1.2fr;
  gap: 8px;
  padding: 0 10px;
  margin-top: 6px;
}
.hd button {
  appearance: none;
  background: none;
  border: 0;
  padding: 8px 0;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-align: left;
  color: var(--muted);
  cursor: pointer;
}
.rows { display: grid; gap: 6px; }
.row { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
.main {
  appearance: none;
  display: grid;
  grid-template-columns: 1.05fr 0.95fr 1.2fr;
  gap: 8px;
  width: 100%;
  padding: 10px;
  text-align: left;
  font: inherit;
  color: var(--ink);
  background: none;
  border: 0;
  cursor: pointer;
  align-items: center;
}
.zs { font-family: var(--serif); font-weight: 700; font-size: 24px; line-height: 1.2; display: block; word-break: keep-all; overflow-wrap: anywhere; }
.tw { display: block; font-family: var(--serif); font-size: 15px; color: var(--muted); margin-top: 2px; }
.cell.p { font-size: 17px; }
.cell.m { font-size: 15px; }
.fl { color: var(--flag); font-size: 14px; margin-left: 4px; }
.row.wide .main { display: block; }
.row.wide .zs { font-size: 20px; }
.row.wide .cell.p { display: block; color: var(--muted); font-size: 15px; margin-top: 4px; }
.row.wide .cell.m { display: block; margin-top: 4px; }
.row.wide .ex { display: block; margin-top: 6px; font-family: var(--serif); font-size: 17px; color: var(--ink); }
.hide-p .row:not(.open) .cell.p { filter: blur(7px); }
.hide-m .row:not(.open) .cell.m { filter: blur(7px); }
.hide-m .row:not(.open) .ex { filter: blur(7px); }
.det { padding: 2px 12px 12px; border-top: 1px dashed var(--line); font-size: 15px; }
.det p { margin: 8px 0 0; }
.det b { font-weight: 600; }
.det .tp { display: inline-block; margin-top: 8px; padding: 2px 9px; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; }
.det .chk { margin-top: 8px; padding: 8px 10px; color: var(--flag); background: var(--flag-bg); border-radius: 8px; font-size: 14px; }
.det .links { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.det .links small { color: var(--muted); font-size: 12px; margin-right: 2px; }
.lnk {
  display: inline-block;
  min-width: 38px;
  padding: 5px 9px;
  text-align: center;
  font-family: var(--serif);
  font-size: 17px;
  color: var(--accent);
  text-decoration: none;
  border: 1.5px solid var(--line);
  border-radius: 8px;
}
.empty { margin: 24px 4px; color: var(--muted); }
.foot { margin: 22px 4px 0; color: var(--muted); font-size: 13px; }
.btn {
  appearance: none;
  width: 100%;
  min-height: 48px;
  margin-top: 16px;
  font: inherit;
  font-weight: 600;
  color: var(--accent-ink);
  background: var(--accent);
  border: 0;
  border-radius: 12px;
  cursor: pointer;
}
.status { margin: 8px 4px 0; color: var(--muted); font-size: 14px; min-height: 20px; }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; }
.filters label:first-child { grid-column: 1 / -1; }
.filters label { min-width: 0; }
.filters label { display: block; }
.filters .lab { display: block; margin: 8px 4px -4px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.02em; }
.pill.reset { color: var(--muted); }
.gtag { display: block; margin-top: 4px; font-size: 13px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip {
  appearance: none;
  padding: 3px 10px;
  font: inherit;
  font-size: 12px;
  color: var(--muted);
  background: none;
  border: 1px solid var(--line);
  border-radius: 10px;
  cursor: pointer;
}
.chip.use { color: var(--accent); border-color: var(--accent); }
.chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.det ul { margin: 6px 0 0; padding-left: 18px; }
.det li { margin-top: 4px; }
.src { margin-top: 8px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<a href="../index.html" style="display:inline-block;margin:calc(10px + env(safe-area-inset-top,0px)) 0 0 16px;font:14px system-ui,-apple-system,sans-serif;color:inherit;opacity:.7;text-decoration:none">← All tools</a>
<main>
<h1>My Mandarin notes</h1>
<p class="sub">Your notes, plus HSK 1 words and a few added phrases. Filter by topic, word type or situation. Tap a row for details.</p>
<input id="q" class="search" type="search" placeholder="Search characters, pinyin or English" aria-label="Search notes" autocomplete="off" autocapitalize="off" spellcheck="false">
<div class="filters">
  <label><span class="lab">Topic (your notebook)</span><select id="f-topic" class="sel"></select></label>
  <label><span class="lab">Word type</span><select id="f-type" class="sel"></select></label>
  <label><span class="lab">Use / situation</span><select id="f-use" class="sel"></select></label>
</div>
<div class="pills" id="pills"></div>
<div class="count" id="count" aria-live="polite"></div>
<div class="hd" id="hd"></div>
<div class="rows" id="rows"></div>
<div id="foot"></div>
</main>

:"sound","uses":["Pronunciation"],"b":"","n":"Marked NE in your notes.","hsk":false,"src":"notes","flag":false},{"kind":"word","s":"ē / è","t":"","p":"ē / è","m":"pinyin vowel e","topic":"Zhuyin chart","type":"sound","uses":["Pronunciation"],"b":"","n":"Your note says ē = long “ee,” è = short “eh.” In pinyin both are the same vowel (roughly “uh”) with different tones. The “eh” sound is written ê, or e in -ie / -ei. Check what you meant.","hsk":false,"src":"notes","flag":true},{"kind":"grammar","s":"Basic order","t":"","p":"","m":"Subject + verb (+ object), same as English","n":"我吃饭。 I eat.","topic":"Grammar: Sentence structure","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #31","extra":[]},{"kind":"grammar","s":"Time goes before the verb","t":"","p":"","m":"Subject + time + verb, or time + subject + verb","n":"我明天吃饭。 / 明天我吃饭。 I'll eat tomorrow.","topic":"Grammar: Sentence structure","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #31","extra":[]},{"kind":"grammar","s":"Place goes after time, before the verb","t":"","p":"","m":"Subject + time + 在 + place + verb + object","n":"我昨天在公司吃饭。 I ate at work yesterday.","topic":"Grammar: Sentence structure","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #17","extra":["Your memory trick: time has to pass before you can be at a place; you have to be at a place before you can do anything. (your notes)"]},{"kind":"grammar","s":"Exceptions: place after the verb","t":"","p":"","m":"住 / 走 / 坐 + 在 + place","n":"我住在北京。 I live in Beijing. 坐 also takes a vehicle directly: 坐飞机.","topic":"Grammar: Sentence structure","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · Beyond A1","extra":[]},{"kind":"grammar","s":"Duration goes after the verb","t":"","p":"","m":"Verb + duration + object","n":"我学了两个小时数学。 I studied math for two hours.","topic":"Grammar: Sentence structure","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":true,"status":"✅ in your notes · Beyond A1","extra":["⚑ Correction: your notes put the duration after the object (… 数学两个小时). The usual order is verb + duration + object."]},{"kind":"grammar","s":"The full long-sentence order","t":"","p":"","m":"Subject + time + manner + place + tool + with whom + verb + object (+ duration)","n":"我昨天在学校用电脑跟朋友学数学。 Yesterday I studied math at school on a computer with my friend.","topic":"Grammar: Sentence structure","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":true,"status":"✅ in your notes · Beyond A1","extra":["⚑ Correction: treat this as a guideline. The middle pieces shift in real speech."]},{"kind":"grammar","s":"Order inside a noun phrase","t":"","p":"","m":"possessive → this / that / number + measure word → adjective → noun","n":"我的两本新书 my two new books","topic":"Grammar: Sentence structure","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · Beyond A1","extra":[]},{"kind":"grammar","s":"\"It\" is usually dropped","t":"","p":"","m":"say what \"it\" is directly.","n":"现在五点。 It's 5 o'clock now. 下雨了。 It's raining.","topic":"Grammar: Sentence structure","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · Beyond A1","extra":[]},{"kind":"grammar","s":"是 links two nouns","t":"","p":"","m":"A + 是 + B","n":"我是学生。 I'm a student. 那个人是谁？ Who is that person? (your notes)","topic":"Grammar: Sentence structure","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #32","extra":["Note: One word for is, am, are, was. Not used before adjectives (see section 4)."]},{"kind":"grammar","s":"Yes-no questions with 吗","t":"","p":"","m":"Statement + 吗 ？ Word order stays the same.","n":"你喝水吗？ Do you drink water?","topic":"Grammar: Yes / no and other questions","type":"grammar pattern","uses":["Asking questions"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #39","extra":[]},{"kind":"grammar","s":"Verb + 不 + verb","t":"","p":"","m":"Verb + 不 + verb / Adjective + 不 + adjective","n":"你是不是学生？ 你喜不喜欢？","topic":"Grammar: Yes / no and other questions","type":"grammar pattern","uses":["Asking questions"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #35","extra":["Note: Don't add 吗. Two-syllable verbs can shorten: 喜不喜欢. With two verbs, use the main (usually first) one."]},{"kind":"grammar","s":"有没有","t":"","p":"","m":"有没有 + noun","n":"你有没有书？ Do you have a book?","topic":"Grammar: Yes / no and other questions","type":"grammar pattern","uses":["Asking questions"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #35","extra":["Note: Never 有不有, because the negative of 有 is 没有."]},{"kind":"grammar","s":"Answering yes / no","t":"","p":"","m":"Yes: repeat the verb. 你喝水吗？ 喝。","n":"","topic":"Grammar: Yes / no and other questions","type":"grammar pattern","uses":["Asking questions"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #39","extra":["No: negate the verb. 不喝。"]},{"kind":"grammar","s":"Tag questions with 不","t":"","p":"","m":"Statement, + 好不好 / 是不是 / 对不对 ？","n":"我们明天吃饭，好不好？ Let's eat tomorrow, okay?","topic":"Grammar: Yes / no and other questions","type":"grammar pattern","uses":["Asking questions"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #37","extra":["Note: Can't use 没 here."]},{"kind":"grammar","s":"Tag questions with 吗","t":"","p":"","m":"Statement, + 好吗 / 是吗 / 对吗 ？","n":"你是老师，是吗？ You're a teacher, right?","topic":"Grammar: Yes / no and other questions","type":"grammar pattern","uses":["Asking questions"],"b":"","hsk":false,"src":"notes","flag":false,"status":"○ not learned yet · A1 #38","extra":[]},{"kind":"grammar","s":"Question words stay in place","t":"","p":"","m":"the question word takes the place of the missing information; word order doesn't change.","n":"你喜欢什么菜？ What food do you like? 你什么时候吃饭？ When do you eat?","topic":"Grammar: Yes / no and other questions","type":"grammar pattern","uses":["Asking questions"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #36","extra":["Question words: 什么 what, 谁 who, 哪儿 / 哪里 where, 哪个 which, 什么时候 when, 为什么 why, 怎么 how, 多少 / 几 how many"]},{"kind":"grammar","s":"How to do something with 怎么","t":"","p":"","m":"怎么 + verb ？","n":"这个字怎么写？ How do you write this character?","topic":"Grammar: Yes / no and other questions","type":"grammar pattern","uses":["Asking questions"],"b":"","hsk":false,"src":"notes","flag":false,"status":"◐ partly in your notes · A1 #28","extra":["Note: 怎么样 is different: \"how is it?\" (天气怎么样？)."]},{"kind":"grammar","s":"\"And you?\" with 呢","t":"","p":"","m":"… 呢？","n":"我很好，你呢？ I'm well, and you?","topic":"Grammar: Yes / no and other questions","type":"grammar pattern","uses":["Asking questions"],"b":"","hsk":false,"src":"notes","flag":false,"status":"◐ partly in your notes · A1 #15","extra":["Note: Your notes have 呢 at the end of other sentences (她们在买衣服呢, 爸爸什么时候来北京呢), where it softens the sentence or marks an ongoing action."]},{"kind":"grammar","s":"Suggestions with 吧","t":"","p":"","m":"Suggestion + 吧","n":"走吧！ Let's go! 我们吃饭吧。 Let's eat.","topic":"Grammar: Yes / no and other questions","type":"grammar pattern","uses":["Asking questions"],"b":"","hsk":false,"src":"notes","flag":false,"status":"○ not learned yet · A1 #16","extra":[]},{"kind":"grammar","s":"不 + verb / adjective","t":"","p":"","m":"present, future, habits, and things you don't want to do.","n":"我不吃鱼。 I don't eat fish. 他不高。 He isn't tall.","topic":"Grammar: Negation","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #2","extra":["Tone: 不 is bù, but becomes bú before a 4th tone: 不是 bú shì."]},{"kind":"grammar","s":"没(有) + verb","t":"","p":"","m":"didn't, or hasn't happened yet.","n":"我昨天没吃饭。 I didn't eat yesterday.","topic":"Grammar: Negation","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":true,"status":"✅ in your notes · A1 #29","extra":["Note: Don't add 了 after the verb: ❌ 我没吃了.","⚑ Correction: your notes say \"never use 了 with 没.\" That holds for 没 + verb. But 没 + noun + 了 is normal for \"out of\" or \"no more\": 没钱了 (I'm out of money), 没了 (it's gone)."]},{"kind":"grammar","s":"没有 + noun","t":"","p":"","m":"the negative of 有.","n":"我没有书。 I don't have a book. 没有办法。 There's no way. (your notes)","topic":"Grammar: Negation","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #1","extra":["Note: After 没有, the number and measure word usually drop out."]},{"kind":"grammar","s":"别 / 不要 + verb","t":"","p":"","m":"don't …","n":"别走！ Don't go! 别气我。 Don't make me mad. (your notes)","topic":"Grammar: Negation","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #30","extra":["Note: Mostly interchangeable. Add 了 to mean \"stop\": 别说了 (stop talking)."]},{"kind":"grammar","s":"不太 + adjective","t":"","p":"","m":"not very.","n":"我不太高兴。 I'm not very happy.","topic":"Grammar: Negation","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":true,"status":"✅ in your notes · Beyond A1 (AllSet HSK 1)","extra":["⚑ Correction: your note writes bù tài. It's pronounced bú tài (the 4th-tone change). It takes no 了."]},{"kind":"grammar","s":"A + 没有 + B + adjective","t":"","p":"","m":"A is not as … as B.","n":"你没有我高。 You're not as tall as me. (your notes)","topic":"Grammar: Negation","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · Beyond A1","extra":[]},{"kind":"grammar","s":"Adjectives don't need 是","t":"","p":"","m":"Noun + 很 + adjective","n":"他很高。 He is tall.","topic":"Grammar: Adverbs and describing","type":"grammar pattern","uses":["Describing things"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #34","extra":["Note: 很 often just links the subject and adjective, without meaning \"very.\" 非常 is \"extremely.\""]},{"kind":"grammar","s":"太 + adjective + 了","t":"","p":"","m":"Note: The 了 is needed.","n":"太好了！ Great! 天气太热了。 It's too hot. (your notes)","topic":"Grammar: Adverbs and describing","type":"grammar pattern","uses":["Describing things"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #33","extra":[]},{"kind":"grammar","s":"都 (all, both)","t":"","p":"","m":"Subject + 都 + verb / adjective","n":"我们都说英语。 We all speak English.","topic":"Grammar: Adverbs and describing","type":"grammar pattern","uses":["Describing things"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #3","extra":["Note: After the subject and any time word: 我们今天都在家."]},{"kind":"grammar","s":"也 (also, too)","t":"","p":"","m":"Subject + 也 + verb / adjective","n":"我也吃饭。 I'm eating too. 我也是。 Me too.","topic":"Grammar: Adverbs and describing","type":"grammar pattern","uses":["Describing things"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #4","extra":["Note: Never at the end of the sentence, unlike English \"too.\""]},{"kind":"grammar","s":"Where adverbs go","t":"","p":"","m":"after the subject, before the verb: 我很喜欢这本书.","n":"","topic":"Grammar: Adverbs and describing","type":"grammar pattern","uses":["Describing things"],"b":"","hsk":false,"src":"notes","flag":true,"status":"✅ in your notes · Beyond A1","extra":["⚑ Correction: your notes say adverbs can't come before the subject, but also that some can open a sentence. Both are partly right: most can't, but 也许 and 可能 can (可能他不来)."]},{"kind":"grammar","s":"Adjective + 地 + verb","t":"","p":"","m":"turns an adjective into an adverb, like -ly.","n":"清楚地说 speak clearly. The reduplicated form is 清清楚楚地 (AABB).","topic":"Grammar: Adverbs and describing","type":"grammar pattern","uses":["Describing things"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · Beyond A1","extra":["Note: Not very common; plain adverbs don't need it."]},{"kind":"grammar","s":"Subject + 多 + adjective","t":"","p":"","m":"asks about degree.","n":"你多高？ How tall are you? 你多大了？ How old are you?","topic":"Grammar: Adverbs and describing","type":"grammar pattern","uses":["Describing things"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · Beyond A1","extra":[]},{"kind":"grammar","s":"和 (and, with)","t":"","p":"","m":"Noun + 和 + noun","n":"我和朋友 my friend and I","topic":"Grammar: Linking words","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #5","extra":["Note: Joins nouns only, not verbs or sentences."]},{"kind":"grammar","s":"还是 / 或者 (or)","t":"","p":"","m":"还是 in questions: 你想喝咖啡还是茶？","n":"","topic":"Grammar: Linking words","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #6","extra":["或者 in statements: 我想喝咖啡或者茶。 (或者 is beyond A1.)"]},{"kind":"grammar","s":"的: possession","t":"","p":"","m":"Noun + 的 + noun","n":"我的书 my book, 老师的电脑 the teacher's computer","topic":"Grammar: Linking words","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #14","extra":[]},{"kind":"grammar","s":"Close possession without 的","t":"","p":"","m":"Pronoun + noun (family, close relationships, groups)","n":"我妈妈 my mom, 我朋友 my friend, 我们学校 our school","topic":"Grammar: Linking words","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"○ not learned yet · A1 #13","extra":[]},{"kind":"grammar","s":"的: description + noun","t":"","p":"","m":"","n":"好吃的菜 tasty food. Drop the noun to mean \"the … one\": 大的 the big one.","topic":"Grammar: Linking words","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · Beyond A1","extra":[]},{"kind":"grammar","s":"喜欢 + verb","t":"","p":"","m":"","n":"我喜欢吃饭。 I like eating.","topic":"Grammar: Verbs and helping verbs","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · Beyond A1","extra":[]},{"kind":"grammar","s":"想 + verb","t":"","p":"","m":"want to, would like to (softer than 要).","n":"我想买水。 I'd like to buy water.","topic":"Grammar: Verbs and helping verbs","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · Beyond A1","extra":[]},{"kind":"grammar","s":"要 + verb: want","t":"","p":"","m":"","n":"我要喝水。 I want water.","topic":"Grammar: Verbs and helping verbs","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"◐ partly in your notes · A1 #27","extra":[]},{"kind":"grammar","s":"要 + verb: going to","t":"","p":"","m":"Note: Don't use 在 for the future: 在 + verb means happening right now.","n":"我明天要去北京。 I'm going to Beijing tomorrow. 他就要来了。 He's about to arrive.","topic":"Grammar: Verbs and helping verbs","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"◐ partly in your notes · A1 #25","extra":[]},{"kind":"grammar","s":"会 + verb","t":"","p":"","m":"⚑ Correction: your note lists only \"can (a learned skill).\" 会 also predicts the future: 明天会很好 (tomorrow will be good).","n":"我会说中文。 I can speak Chinese. 我会画画。 I can draw. (your notes)","topic":"Grammar: Verbs and helping verbs","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":true,"status":"✅ in your notes · A1 #24","extra":[]},{"kind":"grammar","s":"能 + verb","t":"","p":"","m":"able to, when circumstances allow.","n":"我能吃一块吗？ Can I have a piece?","topic":"Grammar: Verbs and helping verbs","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"◐ partly in your notes · A1 #23","extra":["Note: 可能 = maybe. You answered \"possible\" for 能 on the exam."]},{"kind":"grammar","s":"可以 + verb","t":"","p":"","m":"may, be allowed to.","n":"我可以坐这儿吗？ May I sit here? 可以。 Sure.","topic":"Grammar: Verbs and helping verbs","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"○ not learned yet · A1 #26","extra":[]},{"kind":"grammar","s":"得 + verb / 不用 + verb","t":"","p":"","m":"have to / don't need to.","n":"我得走了。 I have to go. 你不用来。 You don't need to come.","topic":"Grammar: Verbs and helping verbs","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · Beyond A1","extra":["Note: Not 不得."]},{"kind":"grammar","s":"让 + person + verb","t":"","p":"","m":"let, make or ask someone to do something.","n":"他让我睡觉。 He lets me sleep. 你让我很高兴。 You make me happy.","topic":"Grammar: Verbs and helping verbs","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · Beyond A1","extra":[]},{"kind":"grammar","s":"想让 + person + verb","t":"","p":"","m":"want someone to do something.","n":"我想让你学习。 I want you to study.","topic":"Grammar: Verbs and helping verbs","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · Beyond A1","extra":[]},{"kind":"grammar","s":"去 + place","t":"","p":"","m":"Note: No 在 needed; 去 already carries the place.","n":"我明天去学校。 I'm going to school tomorrow.","topic":"Grammar: Verbs and helping verbs","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"◐ partly in your notes · A1 #21","extra":[]},{"kind":"grammar","s":"叫 + name","t":"","p":"","m":"","n":"我叫Sam。 My name is Sam. 你叫什么名字？ What's your name?","topic":"Grammar: Verbs and helping verbs","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"○ not learned yet · A1 #20","extra":[]},{"kind":"grammar","s":"姓 + surname","t":"","p":"","m":"","n":"我姓王。 My surname is Wang. 您贵姓？ What's your surname? (polite)","topic":"Grammar: Verbs and helping verbs","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"○ not learned yet · A1 #22","extra":[]},{"kind":"grammar","s":"Verb + 到: result","t":"","p":"","m":"you succeeded at the action.","n":"找到 find, 听到 hear, 看到 see, 买到 manage to buy. Negative: 找不到 (can't find).","topic":"Grammar: Complements (what happens after the verb)","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · Beyond A1","extra":[]},{"kind":"grammar","s":"Verb + 来 / 去: direction","t":"","p":"","m":"toward (来) or away from (去) the speaker.","n":"下来 come down, 下去 go down.","topic":"Grammar: Complements (what happens after the verb)","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · Beyond A1","extra":[]},{"kind":"grammar","s":"(正)在 + verb (+ 呢)","t":"","p":"","m":"is doing. 正在 stresses \"right now.\"","n":"她们在买衣服呢。 They're buying clothes. (your notes)","topic":"Grammar: Actions in progress","type":"grammar pattern","uses":["Grammar glue"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · Beyond A1 (AllSet HSK 1)","extra":[]},{"kind":"grammar","s":"二 vs 两","t":"","p":"","m":"二 is the plain number: counting, 二十, 第二 (2nd).","n":"","topic":"Grammar: Numbers, measure words, dates and time","type":"grammar pattern","uses":["Time & plans","Shopping & money"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #40","extra":["两 comes before a measure word: 两个人, 两本书, 两点, 两块钱."]},{"kind":"grammar","s":"Numbers go big to small","t":"","p":"","m":"","n":"二十二 22, 一百 100","topic":"Grammar: Numbers, measure words, dates and time","type":"grammar pattern","uses":["Time & plans","Shopping & money"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #11","extra":[]},{"kind":"grammar","s":"Number + measure word + noun","t":"","p":"","m":"Note: A measure word is always needed between a number and a noun. 个 is the general one; your full measure-word list is in vocab.csv.","n":"三个朋友 three friends, 两瓶果汁 two bottles of juice","topic":"Grammar: Numbers, measure words, dates and time","type":"grammar pattern","uses":["Time & plans","Shopping & money"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #8","extra":[]},{"kind":"grammar","s":"Age with 岁","t":"","p":"","m":"Note: No 是 needed. Ask with 几岁 (children) or 多大 (adults).","n":"他女儿七岁。 His daughter is seven. (your notes)","topic":"Grammar: Numbers, measure words, dates and time","type":"grammar pattern","uses":["Time & plans","Shopping & money"],"b":"","hsk":false,"src":"notes","flag":false,"status":"◐ partly in your notes · A1 #7","extra":[]},{"kind":"grammar","s":"Dates: year, month, day","t":"","p":"","m":"Note: Big to small, and addresses work the same way. 号 is spoken; 日 is written.","n":"2026年11月9号。 今天几月几号？ What's the date today?","topic":"Grammar: Numbers, measure words, dates and time","type":"grammar pattern","uses":["Time & plans","Shopping & money"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #9","extra":[]},{"kind":"grammar","s":"Days of the week","t":"","p":"","m":"星期 + number. 星期一 Monday … 星期六 Saturday, 星期天 Sunday.","n":"今天星期几？","topic":"Grammar: Numbers, measure words, dates and time","type":"grammar pattern","uses":["Time & plans","Shopping & money"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #10","extra":[]},{"kind":"grammar","s":"Clock time","t":"","p":"","m":"Number + 点 (+ number + 分)","n":"现在十点。 十点二十分。 两点 (not 二点).","topic":"Grammar: Numbers, measure words, dates and time","type":"grammar pattern","uses":["Time & plans","Shopping & money"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #12","extra":[]},{"kind":"grammar","s":"在 + place: be somewhere","t":"","p":"","m":"","n":"我在家。 I'm at home. 你在哪儿？ Where are you?","topic":"Grammar: Location and \"there is\"","type":"grammar pattern","uses":["Getting around"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #17","extra":[]},{"kind":"grammar","s":"Place + 有 + thing: there is","t":"","p":"","m":"","n":"桌子上有一个杯子。 There's a cup on the table. (your notes)","topic":"Grammar: Location and \"there is\"","type":"grammar pattern","uses":["Getting around"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #18","extra":[]},{"kind":"grammar","s":"Subject + 有 + thing: have","t":"","p":"","m":"","n":"我有三个朋友。 I have three friends.","topic":"Grammar: Location and \"there is\"","type":"grammar pattern","uses":["Getting around"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · A1 #19","extra":[]},{"kind":"grammar","s":"Specific location: object + direction word","t":"","p":"","m":"Subject + 在 + place + direction word","n":"猫在桌子上面。 The cat is on the table. 商店在学校后边。 The shop is behind the school.","topic":"Grammar: Location and \"there is\"","type":"grammar pattern","uses":["Getting around"],"b":"","hsk":false,"src":"notes","flag":false,"status":"✅ in your notes · Beyond A1","extra":[]},{"kind":"sentence","s":"来我们看看里面是什么东西。","t":"","p":"lái wǒmen kànkan lǐmiàn shì shénme dōngxi.","m":"Come on, let's see what's inside.","topic":"Practice sentences","type":"sentence","uses":[],"b":"","n":"","hsk":false,"src":"notes","flag":false},{"kind":"sentence","s":"喂，你睡觉了吗？","t":"","p":"wèi, nǐ shuìjiào le ma?","m":"Hello, have you gone to sleep?","topic":"Practice sentences","type":"sentence","uses":[],"b":"","n":"Your note says \"are you sleeping?\"","hsk":false,"src":"notes","flag":false},{"kind":"sentence","s":"天气太热了，多吃些水果。","t":"","p":"tiānqì tài rè le, duō chī xiē shuǐguǒ.","m":"It's too hot; eat more fruit.","topic":"Practice sentences","type":"sentence","uses":[],"b":"","n":"多吃些 means \"eat more,\" not \"eat many.\"","hsk":false,"src":"notes","flag":false},{"kind":"sentence","s":"你好，我能吃一块儿吗？","t":"","p":"nǐ hǎo, wǒ néng chī yí kuàir ma?","m":"Hello, can I have a piece?","topic":"Practice sentences","type":"sentence","uses":[],"b":"","n":"一块儿 more often means \"together.\" For \"a piece,\" 一块 is clearer, and it's what Taiwan says.","hsk":false,"src":"notes","flag":false},{"kind":"sentence","s":"我很喜欢这本书。","t":"","p":"wǒ hěn xǐhuan zhè běn shū.","m":"I really like this book.","topic":"Practice sentences","type":"sentence","uses":[],"b":"","n":"","hsk":false,"src":"notes","flag":false},{"kind":"sentence","s":"她们在买衣服呢。","t":"","p":"tāmen zài mǎi yīfu ne.","m":"They're buying clothes.","topic":"Practice sentences","type":"sentence","uses":[],"b":"","n":"","hsk":false,"src":"notes","flag":false},{"kind":"sentence","s":"那个人是谁？","t":"","p":"nàge rén shì shéi?","m":"Who is that person?","topic":"Practice sentences","type":"sentence","uses":[],"b":"","n":"","hsk":false,"src":"notes","flag":false},{"kind":"sentence","s":"我不认识她。","t":"","p":"wǒ bú rènshi tā.","m":"I don't know her.","topic":"Practice sentences","type":"sentence","uses":[],"b":"","n":"","hsk":false,"src":"notes","flag":false},{"kind":"sentence","s":"你喝水吗？好的，谢谢。","t":"","p":"nǐ hē shuǐ ma? hǎo de, xièxie.","m":"Do you drink water? Okay, thanks.","topic":"Practice sentences","type":"sentence","uses":[],"b":"","n":"","hsk":false,"src":"notes","flag":false},{"kind":"se /* DATA END */

var ENTRIES = DATA.entries.map(function (e, i) { e.i = i; return e; });
var TOPICS = DATA.topics, TYPES = DATA.types, USES = DATA.uses;
var app = { q: "", topic: "All", type: "All", use: "All", hsk: false, onlyFlag: false,
            hideP: false, hideM: false, tw: true, sortKey: null, sortDir: 1, shuffled: null };
var SAVED = ["topic", "type", "use", "hsk", "onlyFlag", "hideP", "hideM", "tw"];
try {
  var st = JSON.parse(localStorage.getItem("notes-filters") || "{}");
  SAVED.forEach(function (k) { if (k in st) app[k] = st[k]; });
} catch (e) {}
function save() {
  try { var o = {}; SAVED.forEach(function (k) { o[k] = app[k]; }); localStorage.setItem("notes-filters", JSON.stringify(o)); } catch (e) {}
}

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function plain(s) { return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
function isWide(e) { return e.kind !== "word"; }

var elQ = document.getElementById("q");
var elRows = document.getElementById("rows");
var elCount = document.getElementById("count");
var elHd = document.getElementById("hd");
var elPills = document.getElementById("pills");
var sel = { topic: document.getElementById("f-topic"), type: document.getElementById("f-type"), use: document.getElementById("f-use") };

function countBy(fn) {
  var c = {};
  ENTRIES.forEach(function (e) { [].concat(fn(e)).forEach(function (v) { c[v] = (c[v] || 0) + 1; }); });
  return c;
}
function fillSelect(key, values, counts, allLabel) {
  var s = sel[key];
  s.innerHTML = "";
  var a = el("option", "", allLabel + " (" + ENTRIES.length + ")");
  a.value = "All";
  s.appendChild(a);
  var group = null;
  values.forEach(function (v) {
    var target = s;
    if (key === "topic" && v.indexOf("Grammar: ") === 0) {
      if (!group) { group = el("optgroup"); group.label = "Grammar"; s.appendChild(group); }
      target = group;
    }
    var o = el("option", "", (key === "topic" ? v.replace("Grammar: ", "") : v) + " (" + (counts[v] || 0) + ")");
    o.value = v;
    target.appendChild(o);
  });
  if (values.indexOf(app[key]) === -1) app[key] = "All";
  s.value = app[key];
  s.addEventListener("change", function () { app[key] = s.value; app.shuffled = null; save(); render(); });
}
function buildFilters() {
  fillSelect("topic", TOPICS, countBy(function (e) { return e.topic; }), "All topics");
  fillSelect("type", TYPES, countBy(function (e) { return e.type; }), "All types");
  fillSelect("use", USES, countBy(function (e) { return e.uses; }), "All situations");
}

function pill(label, key, after) {
  var b = el("button", "pill", label);
  b.type = "button";
  b.setAttribute("aria-pressed", String(!!app[key]));
  b.addEventListener("click", function () {
    app[key] = !app[key];
    b.setAttribute("aria-pressed", String(!!app[key]));
    save();
    after();
  });
  elPills.appendChild(b);
}
function applyHide() {
  elRows.classList.toggle("hide-p", app.hideP);
  elRows.classList.toggle("hide-m", app.hideM);
}
function buildPills() {
  pill("HSK 1 only", "hsk", render);
  pill("Check these ⚑", "onlyFlag", render);
  pill("Hide pinyin", "hideP", applyHide);
  pill("Hide meaning", "hideM", applyHide);
  pill("Show TW forms", "tw", render);
  var sh = el("button", "pill", "Shuffle");
  sh.type = "button";
  sh.addEventListener("click", function () {
    var idx = ENTRIES.map(function (e) { return e.i; });
    for (var i = idx.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = idx[i]; idx[i] = idx[j]; idx[j] = t;
    }
    app.shuffled = idx;
    app.sortKey = null;
    render();
  });
  elPills.appendChild(sh);
  var rs = el("button", "pill reset", "Clear filters");
  rs.type = "button";
  rs.addEventListener("click", function () {
    app.q = ""; elQ.value = "";
    app.topic = app.type = app.use = "All";
    app.hsk = app.onlyFlag = false;
    app.shuffled = null; app.sortKey = null;
    ["topic", "type", "use"].forEach(function (k) { sel[k].value = "All"; });
    Array.prototype.forEach.call(elPills.querySelectorAll(".pill[aria-pressed]"), function (b, n) {
      if (n < 2) b.setAttribute("aria-pressed", "false");
    });
    save();
    render();
  });
  elPills.appendChild(rs);
}

function buildHeader() {
  elHd.innerHTML = "";
  [["s", "Word"], ["p", "Pinyin"], ["m", "Meaning"]].forEach(function (c) {
    var b = el("button", "", c[1] + (app.sortKey === c[0] ? (app.sortDir > 0 ? " ▲" : " ▼") : ""));
    b.type = "button";
    b.setAttribute("aria-label", "Sort by " + c[1]);
    b.addEventListener("click", function () {
      if (app.sortKey === c[0]) app.sortDir = -app.sortDir; else { app.sortKey = c[0]; app.sortDir = 1; }
      app.shuffled = null;
      render();
    });
    elHd.appendChild(b);
  });
}

function matches(e) {
  if (app.topic !== "All" && e.topic !== app.topic) return false;
  if (app.type !== "All" && e.type !== app.type) return false;
  if (app.use !== "All" && e.uses.indexOf(app.use) === -1) return false;
  if (app.hsk && !e.hsk) return false;
  if (app.onlyFlag && !e.flag) return false;
  var q = app.q.trim();
  if (!q) return true;
  var ql = q.toLowerCase(), qp = plain(q);
  var hay = [e.s, e.t, e.m, e.n, e.b, e.topic, e.type, e.uses.join(" ")].join(" ").toLowerCase();
  if (hay.indexOf(ql) !== -1) return true;
  return plain(e.p).indexOf(qp) !== -1 || plain(e.m).indexOf(qp) !== -1;
}

function strokeChars(e) {
  var seen = {}, chars = [];
  (e.s + (e.t || "")).split("").forEach(function (ch) {
    if (/[一-鿿]/.test(ch) && !seen[ch]) { seen[ch] = 1; chars.push(ch); }
  });
  return chars.slice(0, 8);
}

function setFilter(key, value) {
  app[key] = value;
  sel[key].value = value;
  app.shuffled = null;
  save();
  render();
  window.scrollTo(0, 0);
}

var SOURCE = {
  "hsk-list": "On the HSK 1 list but not in your notes yet.",
  "added": "Added by Claude, not from your notes. Check it with friends."
};

function rowEl(e) {
  var wide = isWide(e);
  var row = el("div", "row" + (wide ? " wide" : ""));
  var btn = el("button", "main");
  btn.type = "button";
  btn.setAttribute("aria-expanded", "false");

  var w = el("span", "cell w");
  var zs = el("span", "zs", e.s);
  if (e.flag) zs.appendChild(el("span", "fl", "⚑"));
  w.appendChild(zs);
  if (e.t && app.tw && !wide) w.appendChild(el("span", "tw", "TW " + e.t));
  btn.appendChild(w);
  if (e.kind === "grammar") btn.appendChild(el("span", "gtag", e.status));
  if (e.p) btn.appendChild(el("span", "cell p", e.p));
  btn.appendChild(el("span", "cell m", e.m));
  if (e.kind === "grammar" && e.n) btn.appendChild(el("span", "ex", e.n));
  row.appendChild(btn);

  var det = el("div", "det");
  det.hidden = true;
  if (e.t && !wide) det.appendChild(el("p", "", "Traditional (TW): " + e.t));
  if (e.b) det.appendChild(el("p", "", "Parts: " + e.b));
  if (e.kind !== "grammar" && e.n) det.appendChild(el("p", "", e.n));
  if (e.extra && e.extra.length) {
    var ul = el("ul");
    e.extra.forEach(function (x) { ul.appendChild(el("li", "", x)); });
    det.appendChild(ul);
  }
  if (e.flag) det.appendChild(el("div", "chk", e.kind === "grammar"
    ? "⚑ Your handwritten note on this needed a correction. It's stated above."
    : "⚑ Worth double-checking: a reading was unclear or the note may need a correction."));
  if (SOURCE[e.src]) det.appendChild(el("p", "src", SOURCE[e.src]));

  var chips = el("div", "chips");
  function chip(label, key, value, cls) {
    var c = el("button", "chip" + (cls ? " " + cls : ""), label);
    c.type = "button";
    c.setAttribute("aria-label", "Show all: " + label);
    c.addEventListener("click", function (ev) { ev.stopPropagation(); setFilter(key, value); });
    chips.appendChild(c);
  }
  chip(e.topic.replace("Grammar: ", "Grammar · "), "topic", e.topic);
  chip(e.type, "type", e.type);
  e.uses.forEach(function (u) { chip(u, "use", u, "use"); });
  if (e.hsk) chips.appendChild(el("span", "chip", "HSK 1"));
  det.appendChild(chips);

  if (e.kind === "word" && e.type !== "sound") {
    var chars = strokeChars(e);
    if (chars.length) {
      var box = el("div", "links");
      box.appendChild(el("small", "", "Stroke order:"));
      chars.forEach(function (ch) {
        var a = el("a", "lnk", ch);
        a.href = "https://www.strokeorder.com/chinese/" + encodeURIComponent(ch);
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.setAttribute("aria-label", "Stroke order for " + ch);
        box.appendChild(a);
      });
      det.appendChild(box);
    }
  }
  row.appendChild(det);

  btn.addEventListener("click", function () {
    var open = det.hidden;
    det.hidden = !open;
    row.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", String(open));
  });
  return row;
}

function render() {
  buildHeader();
  var list = ENTRIES.filter(matches);
  if (app.shuffled) {
    var pos = {};
    app.shuffled.forEach(function (id, k) { pos[id] = k; });
    list.sort(function (a, b) { return pos[a.i] - pos[b.i]; });
  } else if (app.sortKey) {
    var k = app.sortKey;
    list.sort(function (a, b) {
      var x = k === "s" ? a.s : plain(a[k]), y = k === "s" ? b.s : plain(b[k]);
      return (x < y ? -1 : x > y ? 1 : 0) * app.sortDir;
    });
  }
  elRows.innerHTML = "";
  list.forEach(function (e) { elRows.appendChild(rowEl(e)); });
  if (!list.length) elRows.appendChild(el("p", "empty", "Nothing matches. Try fewer letters, or tap Clear filters."));
  elCount.textContent = "Showing " + list.length + " of " + ENTRIES.length;
  applyHide();
}

function csvText() {
  function q(s) { return '"' + String(s || "").replace(/"/g, '""') + '"'; }
  var rows = [["Simplified", "Traditional (TW)", "Pinyin", "Meaning", "Topic", "Type", "Use", "HSK 1", "Parts", "Note", "Check"]];
  ENTRIES.forEach(function (e) {
    rows.push([e.s, e.t, e.p, e.m, e.topic, e.type, e.uses.join("; "), e.hsk ? "yes" : "", e.b, e.n, e.flag ? "check" : ""]);
  });
  return "﻿" + rows.map(function (r) { return r.map(q).join(","); }).join("\n");
}

function buildFoot() {
  var foot = document.getElementById("foot");
  var note = el("p", "foot", "Built from your handwritten notes. Topics follow your notebook; word type and situation are extra filters. ⚑ means a reading was unclear or your note needed a correction. Grammar examples were written by Claude. Stroke-order links go to strokeorder.com.");
  foot.appendChild(note);
  var status = el("p", "status");
  status.setAttribute("role", "status");
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then(function (dl) {
      if (!dl) return;
      var b = el("button", "btn", "Save everything as a spreadsheet file (CSV)");
      b.type = "button";
      b.addEventListener("click", function () {
        dl.save({ filename: "mandarin-notes.csv", data: csvText() }).then(function () {
          status.textContent = "Saved. Open it in Sheets or Excel.";
        }, function (err) {
          status.textContent = err && err.code === "declined" ? "Not saved." : "Saving isn’t available here.";
        });
      });
      foot.insertBefore(b, note);
    }, function () {});
  }
  foot.appendChild(status);
}

elQ.addEventListener("input", function () { app.q = elQ.value; app.shuffled = null; render(); });
buildFilters();
buildPills();
buildFoot();
render();
</script>
</body>
</html>
