<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Mandarin notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #edf1f5;
  --surface: #ffffff;
  --ink: #16222e;
  --muted: #5a6978;
  --line: #cbd5df;
  --accent: #1d6f8a;
  --accent-ink: #ffffff;
  --flag: #9a5b00;
  --flag-bg: #fbeed3;
  --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1820;
    --surface: #17232e;
    --ink: #e6edf3;
    --muted: #94a3b2;
    --line: #2b3b49;
    --accent: #5bb3d0;
    --accent-ink: #0b1620;
    --flag: #f0b45a;
    --flag-bg: #3a2c12;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1820;
  --surface: #17232e;
  --ink: #e6edf3;
  --muted: #94a3b2;
  --line: #2b3b49;
  --accent: #5bb3d0;
  --accent-ink: #0b1620;
  --flag: #f0b45a;
  --flag-bg: #3a2c12;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.4;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 10;
}
main { max-width: 640px; margin: 0 auto; padding: 14px 12px 32px; }
h1 { font-size: 22px; line-height: 1.2; margin: 4px 4px 4px; }
.sub { margin: 0 4px 12px; color: var(--muted); font-size: 14px; }
.search {
  display: block;
  width: 100%;
  min-height: 48px;
  padding: 10px 14px;
  font: inherit;
  font-size: 17px;
  color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 12px;
}
.search:focus, .sel:focus { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.sel {
  display: block;
  width: 100%;
  min-height: 46px;
  margin-top: 8px;
  padding: 8px 12px;
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 12px;
}
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
.pill {
  appearance: none;
  min-height: 40px;
  padding: 6px 13px;
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 20px;
  cursor: pointer;
}
.pill[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); font-weight: 600; }
.pill:focus-visible, .main:focus-visible, .hd button:focus-visible, .btn:focus-visible, .lnk:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.count { margin: 8px 4px 6px; color: var(--muted); font-size: 14px; }
.hd {
  display: grid;
  grid-template-columns: 1.05fr 0.95fr 1.2fr;
  gap: 8px;
  padding: 0 10px;
  margin-top: 6px;
}
.hd button {
  appearance: none;
  background: none;
  border: 0;
  padding: 8px 0;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-align: left;
  color: var(--muted);
  cursor: pointer;
}
.rows { display: grid; gap: 6px; }
.row { background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
.main {
  appearance: none;
  display: grid;
  grid-template-columns: 1.05fr 0.95fr 1.2fr;
  gap: 8px;
  width: 100%;
  padding: 10px;
  text-align: left;
  font: inherit;
  color: var(--ink);
  background: none;
  border: 0;
  cursor: pointer;
  align-items: center;
}
.zs { font-family: var(--serif); font-weight: 700; font-size: 24px; line-height: 1.2; display: block; word-break: keep-all; overflow-wrap: anywhere; }
.tw { display: block; font-family: var(--serif); font-size: 15px; color: var(--muted); margin-top: 2px; }
.cell.p { font-size: 17px; }
.cell.m { font-size: 15px; }
.fl { color: var(--flag); font-size: 14px; margin-left: 4px; }
.row.wide .main { display: block; }
.row.wide .zs { font-size: 20px; }
.row.wide .cell.p { display: block; color: var(--muted); font-size: 15px; margin-top: 4px; }
.row.wide .cell.m { display: block; margin-top: 4px; }
.row.wide .ex { display: block; margin-top: 6px; font-family: var(--serif); font-size: 17px; color: var(--ink); }
.hide-p .row:not(.open) .cell.p { filter: blur(7px); }
.hide-m .row:not(.open) .cell.m { filter: blur(7px); }
.hide-m .row:not(.open) .ex { filter: blur(7px); }
.det { padding: 2px 12px 12px; border-top: 1px dashed var(--line); font-size: 15px; }
.det p { margin: 8px 0 0; }
.det b { font-weight: 600; }
.det .tp { display: inline-block; margin-top: 8px; padding: 2px 9px; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; }
.det .chk { margin-top: 8px; padding: 8px 10px; color: var(--flag); background: var(--flag-bg); border-radius: 8px; font-size: 14px; }
.det .links { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.det .links small { color: var(--muted); font-size: 12px; margin-right: 2px; }
.lnk {
  display: inline-block;
  min-width: 38px;
  padding: 5px 9px;
  text-align: center;
  font-family: var(--serif);
  font-size: 17px;
  color: var(--accent);
  text-decoration: none;
  border: 1.5px solid var(--line);
  border-radius: 8px;
}
.empty { margin: 24px 4px; color: var(--muted); }
.foot { margin: 22px 4px 0; color: var(--muted); font-size: 13px; }
.btn {
  appearance: none;
  width: 100%;
  min-height: 48px;
  margin-top: 16px;
  font: inherit;
  font-weight: 600;
  color: var(--accent-ink);
  background: var(--accent);
  border: 0;
  border-radius: 12px;
  cursor: pointer;
}
.status { margin: 8px 4px 0; color: var(--muted); font-size: 14px; min-height: 20px; }
</style>
</head>

function buildTopic() {
  var counts = {};
  ENTRIES.forEach(function (e) { counts[e.c] = (counts[e.c] || 0) + 1; });
  elTopic.innerHTML = "";
  var all = el("option", "", "All topics (" + ENTRIES.length + ")");
  all.value = "All";
  elTopic.appendChild(all);
  TOPICS.forEach(function (t) {

    o.value = t;
    elTopic.appendChild(o);
  });
  elTopic.addEventListener("change", function () { app.topic = elTopic.value; render(); });
}

function pill(label, key, after) {
  var b = el("button", "pill", label);
  b.type = "button";
  b.setAttribute("aria-pressed", String(!!app[key]));
  b.addEventListener("click", function () {
    app[key] = !app[key];
    b.setAttribute("aria-pressed", String(!!app[key]));
    if (after) after();
  });
  elPills.appendChild(b);
  return b;
}

}
function buildPills() {
  pill("Hide pinyin", "hideP", applyHide);
  pill("Hide meaning", "hideM", applyHide);
  pill("Show TW forms", "tw", render);
  pill("Check these ⚑", "onlyFlag", render);
  var sh = el("button", "pill", "Shuffle");
  sh.type = "button";
  sh.addEventListener("click", function () {
    var idx = ENTRIES.map(function (e) { return e.i; });
    for (var i = idx.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = idx[i]; idx[i] = idx[j]; idx[j] = t;
    }
    app.shuffled = idx;
    app.sortKey = null;
    render();
  });
  elPills.appendChild(sh);
  var rs = el("button", "pill", "Reset order");
  rs.type = "button";
  rs.addEventListener("click", function () { app.shuffled = null; app.sortKey = null; render(); });
  elPills.appendChild(rs);
}

function buildHeader() {
  elHd.innerHTML = "";
  [["s", "Word"], ["p", "Pinyin"], ["m", "Meaning"]].forEach(function (c) {
    var b = el("button", "", c[1] + (app.sortKey === c[0] ? (app.sortDir > 0 ? " ▲" : " ▼") : ""));
    b.type = "button";
    b.setAttribute("aria-label", "Sort by " + c[1]);
    b.addEventListener("click", function () {
      if (app.sortKey === c[0]) app.sortDir = -app.sortDir; else { app.sortKey = c[0]; app.sortDir = 1; }
      app.shuffled = null;
      render();
    });
    elHd.appendChild(b);
  });
}

function matches(e) {
  if (app.topic !== "All" && e.c !== app.topic) return false;
  if (app.onlyFlag && !e.f) return false;
  var q = app.q.trim();
  if (!q) return true;
  var ql = q.toLowerCase(), qp = plain(q);
  var hay = [e.s, e.t, e.m, e.c, e.n, e.b].join(" ").toLowerCase();
  if (hay.indexOf(ql) !== -1) return true;
  return plain(e.p).indexOf(qp) !== -1 || plain(e.m).indexOf(qp) !== -1;
}

function linksFor(e) {
  var seen = {}, chars = [];
  (e.s + e.t).split("").forEach(function (ch) {
    if (/[\u4e00-\u9fff]/.test(ch) && !seen[ch]) { seen[ch] = 1; chars.push(ch); }
  });
  return chars.slice(0, 8);
}

function rowEl(e) {
  var wide = isWide(e);
  var row = el("div", "row" + (wide ? " wide" : ""));
  var btn = el("button", "main");
  btn.type = "button";
  btn.setAttribute("aria-expanded", "false");

  var w = el("span", "cell w");
  var zs = el("span", "zs", e.s);
  if (e.f) zs.appendChild(el("span", "fl", "⚑"));
  w.appendChild(zs);
  if (e.t && app.tw && !wide) w.appendChild(el("span", "tw", "TW " + e.t));
  var p = el("span", "cell p", e.p);
  var m = el("span", "cell m", e.m);
  btn.appendChild(w);
  btn.appendChild(p);
  btn.appendChild(m);
  if (e.c === G && e.n) btn.appendChild(el("span", "ex", e.n));
  row.appendChild(btn);

  var det = el("div", "det");
  det.hidden = true;
  if (e.t) det.appendChild(el("p", "", "Traditional (TW): " + e.t));
  if (e.b) det.appendChild(el("p", "", "Parts: " + e.b));
  if (e.n && e.c !== G) det.appendChild(el("p", "", e.n));
  det.appendChild(el("span", "tp", e.c));
  if (e.f) det.appendChild(el("div", "chk", "⚑ Worth double-checking: a reading was unclear or the note may need a correction."));
  if (e.c !== S && e.c !== G && e.c !== Z) {
    var chars = linksFor(e);
    if (chars.length) {
      var box = el("div", "links");
      box.appendChild(el("small", "", "Stroke order:"));
      chars.forEach(function (ch) {
        var a = el("a", "lnk", ch);
        a.href = "https://www.strokeorder.com/chinese/" + encodeURIComponent(ch);
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.setAttribute("aria-label", "Stroke order for " + ch);
        box.appendChild(a);
      });
      det.appendChild(box);
    }
  }
  row.appendChild(det);

  btn.addEventListener("click", function () {
    var open = det.hidden;
    det.hidden = !open;
    row.classList.toggle("open", open);
    btn.setAttribute("aria-expanded", String(open));
  });
  return row;
}

function render() {
  buildHeader();
  var list = ENTRIES.filter(matches);
  if (app.shuffled) {
    var pos = {};
    app.shuffled.forEach(function (id, k) { pos[id] = k; });
    list.sort(function (a, b) { return pos[a.i] - pos[b.i]; });
  } else if (app.sortKey) {
    var k = app.sortKey;
    list.sort(function (a, b) {
      var x = k === "p" ? plain(a.p) : (k === "m" ? a.m.toLowerCase() : a.s);
      var y = k === "p" ? plain(b.p) : (k === "m" ? b.m.toLowerCase() : b.s);
      if (!x && y) return 1;
      if (x && !y) return -1;
      return (x < y ? -1 : x > y ? 1 : 0) * app.sortDir;
    });
  }
  elRows.innerHTML = "";
  list.forEach(function (e) { elRows.appendChild(rowEl(e)); });
  if (!list.length) elRows.appendChild(el("p", "empty", "Nothing matches. Try fewer letters, or switch the topic to All."));
  elCount.textContent = "Showing " + list.length + " of " + ENTRIES.length;
  applyHide();
}

function csvText() {
  function q(s) { return '"' + String(s).replace(/"/g, '""') + '"'; }
  var rows = [["Simplified", "Traditional (TW)", "Pinyin", "Meaning", "Topic", "Parts", "Note", "Check"]];
  ENTRIES.forEach(function (e) { rows.push([e.s, e.t, e.p, e.m, e.c, e.b, e.n, e.f ? "check" : ""]); });
  return "\ufeff" + rows.map(function (r) { return r.map(q).join(","); }).join("\n");
}

function buildFoot() {
  var note = el("p", "foot", "Built from your handwritten notes. ⚑ means a reading was unclear or your note may need a correction. Traditional (TW) forms are shown where they differ. Example sentences in Grammar patterns were written by Claude. Topics marked “(added)” were added by Claude from web phrase lists, not from your notes; check them with friends. Stroke-order links go to strokeorder.com.");
  elFoot.appendChild(note);
  var status = el("p", "status");
  status.setAttribute("role", "status");
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then(function (dl) {
      if (!dl) return;
      var b = el("button", "btn", "Save everything as a spreadsheet file (CSV)");
      b.type = "button";
      b.addEventListener("click", function () {
        dl.save({ filename: "mandarin-notes.csv", data: csvText() }).then(function () {
          status.textContent = "Saved. Open it in Sheets or Excel.";
        }, function (err) {
          status.textContent = err && err.code === "declined" ? "Not saved." : "Saving isn’t available here.";
        });
      });
      elFoot.insertBefore(b, note);
    }, function () {});
  }
  elFoot.appendChild(status);
}

elQ.addEventListener("input", function () { app.q = elQ.value; render(); });
buildTopic();
buildPills();
buildFoot();
render();
</script>
</body>
</html>
